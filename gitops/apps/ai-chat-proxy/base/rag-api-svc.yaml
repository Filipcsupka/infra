# Routing shim only — no pod is scheduled here. The GPU box (100.86.152.16,
# Tailscale IP) is a fully standalone machine running the rag-api + chromadb
# Docker Compose stack (see ai-infra repo, compose/ai-chat/). This is just a
# headless Service + manual EndpointSlice pointing at it, so it's safe for
# ArgoCD to manage with automated selfHeal — unlike the old GPU-scheduled
# pods, there's nothing here that can get stuck if the GPU box is offline.
#
# If the GPU box's Tailscale IP ever changes, update the address below.
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: ai-chat
spec:
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  clusterIP: None   # headless — bypasses kube-proxy, routes directly to Endpoints
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rag-api
  namespace: ai-chat
  labels:
    kubernetes.io/service-name: rag-api
addressType: IPv4
endpoints:
  - addresses:
      - 100.86.152.16  # GPU box Tailscale IP — rag-api Compose container binds host port 8001
ports:
  - name: http
    port: 8001
    protocol: TCP
