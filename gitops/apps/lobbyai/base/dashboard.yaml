# LobbyAI dashboard — Next.js (self-service hotel onboarding). Proxies to the API
# server-side with the admin token (never exposed to the browser). Image tag by CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobbyai-dashboard
  namespace: lobbyai
  labels:
    app: lobbyai-dashboard
    app.kubernetes.io/version: "REPLACED_BY_CI"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lobbyai-dashboard
  template:
    metadata:
      labels:
        app: lobbyai-dashboard
    spec:
      # k3sgpu has no node-level GHCR auth; private images need this pull secret.
      imagePullSecrets:
        - name: ghcr
      nodeSelector:
        kubernetes.io/hostname: k3sgpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: dashboard
          image: ghcr.io/filipcsupka/lobbyai-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: LOBBYAI_API_URL
              value: http://lobbyai-api:8080
            - name: LOBBYAI_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lobbyai-secrets
                  key: ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobbyai-dashboard
  namespace: lobbyai
spec:
  selector:
    app: lobbyai-dashboard
  ports:
    - port: 3001
      targetPort: 3001
