apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: lobbyai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lobbyai
  labels:
    app: postgres
spec:
  replicas: 1
  # RWO PVC pinned to one node — never run two postgres pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Testing: pinned to the GPU node only (k3sgpu). Data lives on that node's
      # local-path PVC → unavailable while the node is powered off.
      nodeSelector:
        kubernetes.io/hostname: k3sgpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: lobbyai
            - name: POSTGRES_DB
              value: lobbyai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lobbyai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lobbyai", "-d", "lobbyai"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lobbyai", "-d", "lobbyai"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: db-init
          configMap:
            name: lobbyai-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lobbyai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
