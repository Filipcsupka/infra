# Expose the Ollama process on the k3sgpu host as a Service inside the lobbyai ns.
# Ollama runs as a host process (not a pod); headless Service + manual EndpointSlice
# point at the k3sgpu Tailscale IP so pods reach it via DNS:
#   http://ollama.lobbyai.svc.cluster.local:11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: lobbyai
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
  clusterIP: None
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama
  namespace: lobbyai
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
endpoints:
  - addresses:
      - 100.86.152.16  # k3sgpu Tailscale IP
ports:
  - name: http
    port: 11434
    protocol: TCP
