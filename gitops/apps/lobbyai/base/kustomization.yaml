apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config.yaml
  - ollama-svc.yaml
  - postgres.yaml
  - api.yaml
  - dashboard.yaml
  - ingress.yaml

configMapGenerator:
  - name: lobbyai-db-init
    namespace: lobbyai
    files:
      - db/01-schema.sql
    options:
      disableNameSuffixHash: true
