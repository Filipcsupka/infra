apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Image tags updated by the lobbyai CI (repository_dispatch → this file).
images:
  - name: ghcr.io/filipcsupka/lobbyai-api
    newName: ghcr.io/filipcsupka/lobbyai-api
    newTag: latest
  - name: ghcr.io/filipcsupka/lobbyai-dashboard
    newName: ghcr.io/filipcsupka/lobbyai-dashboard
    newTag: latest
