# Non-secret runtime config shared by api, web and cronjobs (envFrom).
# Secret counterpart: SealedSecret memorial-secrets (gitops/sealed-secrets/memorial).
apiVersion: v1
kind: ConfigMap
metadata:
  name: memorial-config
  namespace: memorial
data:
  PORT: "3001"
  # 24pay public sandbox. These are vendor-published test credentials, never
  # production merchant credentials. Production values will move to the
  # SealedSecret before the live-gateway cutover.
  PAYMENT_PROVIDER: "24pay"
  API_PUBLIC_URL: "https://memorare.sk"
  TWENTYFOURPAY_MID: "demoOMED"
  TWENTYFOURPAY_ESHOP_ID: "11111111"
  TWENTYFOURPAY_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
  TWENTYFOURPAY_GATEWAY_URL: "https://test.24-pay.eu/pay_gate/paygt"
  WEB_URL: "https://memorare.sk"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "memorial"
  STORAGE_PUBLIC_URL: "https://storage.memorare.sk/memorial"
  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  EMAIL_PROVIDER: "resend"
  EMAIL_FROM: "Memorare <noreply@memorare.sk>"
  EMAIL_REPLY_TO: "info@memorare.sk"
  UPLOAD_DIR: "/tmp/uploads"
