apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memorial
  namespace: memorial
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: memorare.sk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memorial-web
                port:
                  number: 3000
    - host: www.memorare.sk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memorial-web
                port:
                  number: 3000
    # public photo delivery via presigned MinIO URLs
    - host: storage.memorare.sk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
  tls:
    - secretName: memorare-tls
      hosts:
        - memorare.sk
        - www.memorare.sk
    - secretName: memorare-storage-tls
      hosts:
        - storage.memorare.sk
