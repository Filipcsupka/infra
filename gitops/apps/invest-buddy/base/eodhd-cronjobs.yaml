# EODHD data jobs. Enabled 2026-11-06 after secret invest-buddy-eodhd existed and dry runs passed. Fundamentals and insider run before macro/reconcile/daily (04:00 to 04:25).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invest-buddy-eodhd-symbols-sync
  namespace: invest
spec:
  suspend: false
  schedule: "20 5 * * 0"
  timeZone: Europe/Bratislava
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invest-buddy
            app.kubernetes.io/component: eodhd-symbols-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: eodhd-symbols-sync
              image: ghcr.io/filipcsupka/invest-buddy:latest
              command: ["node", "dist/jobs/symbols-sync.js"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-secrets
                      key: DATABASE_URL
                - name: EODHD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: invest-buddy-eodhd
                      key: api-key
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
---
